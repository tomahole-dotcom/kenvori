<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenvori Proof Inspector</title><style>body{font-family:system-ui;max-width:760px;margin:30px auto;padding:18px}img{width:100%;max-width:520px;border:1px solid #ddd;margin:12px 0}b{font-size:1.1rem}</style><h1>Proof Inspector</h1><div id=o>Loading…</div><script>
(async()=>{const d=await (await fetch("/.netlify/functions/proof-inspect")).json();if(!d.ok){o.textContent=JSON.stringify(d);return}o.innerHTML=`<p><b>${d.title}</b></p><p>Printify cost: <b>$${d.baseCostUSD.toFixed(2)}</b><br>Proof price: $${d.salePriceUSD.toFixed(2)}<br>Published: <b>${d.published}</b></p><h2>Mockups</h2>`+d.mockups.map(m=>`<p><b>${m.label||"mockup"}${m.is_default?" — default":""}</b><br><img src="${m.src}"></p>`).join("")})();
</script>
