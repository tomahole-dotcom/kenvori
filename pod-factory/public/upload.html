<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenvori Master Upload</title><style>body{font-family:system-ui;max-width:650px;margin:40px auto;padding:20px}button,input{font-size:18px;margin:12px 0;padding:14px;width:100%}pre{white-space:pre-wrap}</style><h1>Kenvori POD Factory</h1><p>Upload only KF-CANDIDATE-0001 production master (2700×1120 PNG). This uploads to Printify Media Library only. It does not create or publish a product.</p><input id=f type=file accept="image/png"><button id=b disabled>Upload to Printify Media Library</button><pre id=o></pre><script>
const f=document.querySelector("#f"),b=document.querySelector("#b"),o=document.querySelector("#o"); let payload;
f.onchange=()=>{const file=f.files[0]; if(!file)return; const im=new Image(); const rd=new FileReader(); rd.onload=()=>{im.onload=()=>{if(im.width!==2700||im.height!==1120){o.textContent="STOP: wrong dimensions "+im.width+"x"+im.height;return} payload={fileName:file.name,contents:rd.result.split(",")[1],width:im.width,height:im.height,type:file.type}; b.disabled=false;o.textContent="Validated 2700x1120 PNG. Ready.";};im.src=rd.result};rd.readAsDataURL(file)};
b.onclick=async()=>{b.disabled=true;o.textContent="Uploading…";const r=await fetch("/.netlify/functions/upload-master",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});o.textContent=JSON.stringify(await r.json(),null,2)};
</script>
