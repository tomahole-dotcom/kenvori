<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenvori Proof</title><style>body{font-family:system-ui;max-width:650px;margin:40px auto;padding:20px}button{font-size:20px;padding:18px;width:100%}pre{white-space:pre-wrap}</style><h1>Kenvori POD Factory</h1><p>Creates one unpublished Printify proof product. No Etsy publishing or orders.</p><button id=b>Create proof product</button><pre id=o></pre><script>b.onclick=async()=>{b.disabled=true;o.textContent="Creating…";try{const r=await fetch("/.netlify/functions/create-proof-draft",{method:"POST"});o.textContent=JSON.stringify(await r.json(),null,2)}catch(e){o.textContent="ERROR: "+e}finally{b.disabled=false}}</script>
