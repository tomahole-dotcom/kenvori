<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenvori V2 QA</title><style>body{font-family:system-ui;max-width:650px;margin:40px auto;padding:20px}button{font-size:20px;padding:18px;width:100%}pre{white-space:pre-wrap}</style><h1>Kenvori V2 Proof</h1><p>Replaces artwork on the existing unpublished proof only. No Etsy publishing or orders.</p><button id=b>Apply V2 and generate mockups</button><pre id=o></pre><script>b.onclick=async()=>{b.disabled=true;o.textContent="Updating…";try{const r=await fetch("/.netlify/functions/update-proof-v2",{method:"POST"});const d=await r.json();o.textContent=JSON.stringify({ok:d.ok,productId:d.productId,imageId:d.imageId,published:d.published,etsyTouched:d.etsyTouched,ordersTouched:d.ordersTouched,mockupCount:d.mockups?.length,error:d.error},null,2)}catch(e){o.textContent="ERROR: "+e}finally{b.disabled=false}}</script>
