<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenvori Shipping</title><style>body{font-family:system-ui;max-width:760px;margin:30px auto;padding:18px}button{font-size:20px;padding:18px;width:100%}pre{white-space:pre-wrap}</style><h1>Live Shipping Probe</h1><button id=b>Fetch shipping rates</button><pre id=o></pre><script>b.onclick=async()=>{b.disabled=true;o.textContent="Fetching…";try{const d=await(await fetch("/.netlify/functions/shipping-catalog")).json();o.textContent=JSON.stringify(d,null,2)}catch(e){o.textContent="ERROR "+e}finally{b.disabled=false}}</script>
