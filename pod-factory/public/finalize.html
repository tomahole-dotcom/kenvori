<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Finalize Draft</title><style>body{font-family:system-ui;max-width:700px;margin:30px auto;padding:18px}button{font-size:20px;padding:18px;width:100%}img{width:100%;margin-top:14px}</style><h1>Finalize Printify Draft</h1><button id=b>Finalize + QA</button><div id=o></div><script>b.onclick=async()=>{b.disabled=true;o.textContent="Finalizing…";const d=await(await fetch("/.netlify/functions/finalize-proof-draft",{method:"POST"})).json();if(!d.ok){o.textContent=JSON.stringify(d);b.disabled=false;return}o.innerHTML="<p><b>"+d.title+"</b><br>Price: $"+(d.price/100).toFixed(2)+" · Cost: $"+(d.cost/100).toFixed(2)+"<br>Publish endpoint called: <b>"+d.publishEndpointCalled+"</b> · Etsy touched: <b>"+d.etsyTouched+"</b> · Orders touched: <b>"+d.ordersTouched+"</b></p>"+d.mockups.map(m=>"<img src='"+m.src+(m.src.includes("?")?"&":"?")+"v="+Date.now()+"'>").join("");b.disabled=false}</script>
