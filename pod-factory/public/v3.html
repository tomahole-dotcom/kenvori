<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kenvori V3</title><style>body{font-family:system-ui;max-width:700px;margin:30px auto;padding:18px}button{font-size:20px;padding:18px;width:100%}img{width:100%;margin-top:15px}</style><h1>V3 Calibration</h1><button id=b>Apply V3 + show mockup</button><div id=o></div><script>b.onclick=async()=>{b.disabled=true;o.textContent="Updating…";const d=await(await fetch("/.netlify/functions/update-proof-v3",{method:"POST"})).json();if(!d.ok){o.textContent=JSON.stringify(d);b.disabled=false;return}o.innerHTML="<p>Cost: $"+((d.cost||0)/100).toFixed(2)+" · Published: "+d.published+"</p>"+d.mockups.map(m=>"<p><b>"+(m.label||"mockup")+"</b><br><img src='"+m.src+(m.src.includes("?")?"&":"?")+"v="+Date.now()+"'></p>").join("");b.disabled=false}</script>
