name: POD Factory tests
on:
  push:
    branches: [main]
    paths:
      - "pod-factory/**"
      - ".github/workflows/pod-factory-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pod-factory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Factory V1 tests
        run: node --test test/*.test.js
